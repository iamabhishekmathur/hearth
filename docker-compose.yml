services:
  frontend:
    build: ./apps/web
    ports:
      - '3000:80'
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000

  api:
    build: ./apps/api
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://hearth:hearth@postgres:5432/hearth
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env - generate one with openssl rand -hex 32}'
      SESSION_SECRET: '${SESSION_SECRET:?Set SESSION_SECRET in .env - generate one with openssl rand -hex 32}'
      NODE_ENV: production
      API_PORT: '8000'
      WEB_URL: http://localhost:3000
      # Optional. "Use your ChatGPT plan" works on a local install (OpenAI's
      # open-source flow returns to 127.0.0.1). See docs/guide/chatgpt-plan.md.
      CHATGPT_PLAN_ENABLED: '${CHATGPT_PLAN_ENABLED:-false}'
      CHATGPT_CLIENT_ID: '${CHATGPT_CLIENT_ID:-}'
      CHATGPT_REDIRECT_URI: '${CHATGPT_REDIRECT_URI:-}'
      # Optional. Required only if an SSO proxy calls POST /auth/sso/callback.
      SSO_CALLBACK_SECRET: '${SSO_CALLBACK_SECRET:-}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - file_storage:/data/files

  worker:
    build: ./apps/api
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: postgresql://hearth:hearth@postgres:5432/hearth
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env - generate one with openssl rand -hex 32}'
      SESSION_SECRET: '${SESSION_SECRET:?Set SESSION_SECRET in .env - generate one with openssl rand -hex 32}'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - file_storage:/data/files

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hearth']
      interval: 5s
      timeout: 5s
      retries: 5

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - '3001:80'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  file_storage:
